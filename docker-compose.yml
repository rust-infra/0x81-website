services:
  website:
    build: ./website
    ports:
      - "4321:4321"
    restart: unless-stopped

  0xindex:
    build: ./0xindex
    ports:
      - "4320:4320"
    restart: unless-stopped

  crab-web:
    build: ./crab-web
    ports:
      - "4322:4322"
    restart: unless-stopped

  website-rs:
    build:
      context: ./website-rs
      args:
        REGISTRY: docker.m.daocloud.io/library/
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RUST_LOG=info
      - PROXY_UPSTREAM_HOST_TACT=website
      - PROXY_UPSTREAM_HOST_INDEX=0xindex
      - PROXY_UPSTREAM_HOST_CRAB=crab-web
      - TLS_CERT_PATH=/certs/origin.pem
      - TLS_KEY_PATH=/certs/origin-key.pem
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - website
      - 0xindex
      - crab-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
