services:
  website:
    build: ./website
    ports:
      - "4321:4321"
    restart: unless-stopped

  website-rs:
    build:
      context: ./website-rs
      args:
        REGISTRY: docker.m.daocloud.io/library/
    ports:
      - "80:80"
    environment:
      - RUST_LOG=info
      - PROXY_UPSTREAM_HOST_TACT=website
    depends_on:
      - website
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
