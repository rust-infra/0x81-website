services:
  website:
    build: ./website
    ports:
      - "4321:4321"
    restart: unless-stopped

  0xindex:
    build: ./0xindex
    ports:
      - "4320:4320"
    restart: unless-stopped

  crab-web:
    build: ./crab-web
    ports:
      - "4322:4322"
    restart: unless-stopped

  moyan-backend:
    # 服务器不编译：二进制由 CI（release workflow，打 tag 触发）编好并以 release
    # 资产发布，服务器用 scripts/fetch-rust.sh <tag> 拉到 ./bin/；这里只用
    # Dockerfile 的 runtime stage（仅运行时依赖：ffmpeg/python3/yt-dlp），
    # 再把它挂载进容器。
    image: 0x81/moyan-backend-runtime:local
    # 这个镜像只含运行时依赖，是 compose 在本机构建出来的产物，**不存在于任何 registry**：
    # pull_policy: build 告诉 compose 不要试图 pull（否则在尚未构建过该镜像的机器上会打出
    # "pull access denied for 0x81/moyan-backend-runtime" 之类的告警，docker compose pull
    # 更会直接报错），镜像不在本地缓存时才构建。
    pull_policy: build
    build:
      context: ./moyan-backend
      target: runtime
    ports:
      - "4323:4323"
    environment:
      - PORT=4323
      - DATABASE_BACKEND=${MOYAN_DATABASE_BACKEND:-sqlite}
      - DATABASE_URL=${MOYAN_DATABASE_URL:-sqlite:/data/moyan.db}
      - MONGODB_DATABASE=${MOYAN_MONGODB_DATABASE:-moyan}
      # ⚠️ 键名与默认值都改过（§7.7）：`MOYAN_JWT_SECRET` → `AUTH_JWT_SECRET`，
      # 并把 `:-change-me-in-production` 换成 `:?`。理由见 rehearse-backend 那段
      # 注释与 .env.example 顶部：漏改 .env 时「带假密钥正常启动、所有 token
      # 验不过」比启动失败难查得多。**两个后端必须读到同一个值。**
      - JWT_SECRET=${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      - GOOGLE_CLIENT_ID=${MOYAN_GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${MOYAN_GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${MOYAN_GOOGLE_REDIRECT_URL:-http://localhost:4323/api/auth/google/callback}
      - ADMIN_TOKEN=${AUTH_ADMIN_TOKEN:?AUTH_ADMIN_TOKEN is required}
      - ALLOWED_ORIGINS=${MOYAN_ALLOWED_ORIGINS:-http://localhost:5000,http://localhost:5001,https://moyan.0x81.uk,https://admin-moyan.0x81.uk,https://admin.moyan.0x81.uk}
      - RUST_LOG=${RUST_LOG:-info}
      # Data collection (yt-dlp) proxy. **默认不注入代理**：本机没有本地代理
      # （Clash/socat 均不存在，127.0.0.1:7890 与 host-gateway:17890 都没有监听），
      # 而宿主可直连 YouTube。此前的默认值 http://host.docker.internal:17890
      # 指向一个没人监听的端口，导致 yt-dlp 报
      #   ERROR: Unable to download API page: [Errno 111] Connection refused
      # （直连则正常）。需要代理时（例如部署到墙内）在仓库根 .env 里显式设置：
      #   MOYAN_YTDLP_PROXY=http://host.docker.internal:17890
      # 并在宿主用 socat 把 host-gateway:17890 转发到 127.0.0.1:7890
      # （host.docker.internal -> host-gateway；127.0.0.1 在容器内是容器自己）。
      # MOYAN_YTDLP_PROXY 在 normalize_proxy() 里优先级最高；标准变量同时覆盖
      # reqwest 客户端（Google OAuth 等），所以一并留空。
      - MOYAN_YTDLP_PROXY=${MOYAN_YTDLP_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      # Kimi auth is a direct, China-reachable service. Keep it off the host
      # proxy so a broken/slow Clash forward cannot turn device auth into 500.
      - NO_PROXY=auth.kimi.com,${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
    extra_hosts:
      # Maps host.docker.internal to the docker bridge gateway (172.17.0.1).
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite 数据目录。dev 默认用仓库内的 ./moyan-backend/data（不改 .env 就是它）；
      # 生产在仓库根 .env 里设 MOYAN_DATA_DIR=/data/moyan-data，把库放到独立数据盘上
      # （本机 /data 是 /dev/vdb1）。
      #   改这个键等于换挂载源：必须 `docker compose up -d`（会重建容器）才生效，
      #   `restart` 只重新解析同一个源路径，不会换目录。
      #   迁移已有数据：停容器 → 把 moyan.db 拷到新目录 → up -d → 校验容器内
      #   `stat -c %i /data` 与新目录 inode 相同、行数一致。
      # :Z relabels the bind mount to container_file_t so the container can
      # write the SQLite DB on SELinux-enforcing hosts (SQLITE_CANTOPEN otherwise)
      - ${MOYAN_DATA_DIR:-./moyan-backend/data}:/data:Z
      # 二进制（scripts/fetch-rust.sh 从 release 拉取；本地构建则跑
      # scripts/build-rust.sh）。:Z 同上，SELinux 下可读可执行。
      # 注意：先跑 scripts/fetch-rust.sh，否则 compose 会把不存在的路径建成空目录。
      - ./bin/moyan-backend:/app/moyan-backend:ro,Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4323/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  moyan-web:
    build:
      context: ./moyan-web
      args:
        # 显式开启「服务端为权威」模式（见 moyan-web/src/services/backendMode.ts）。
        # 线上同源部署，VITE_API_URL 故意留空（请求走相对路径 /api，由 Caddy 反代到
        # moyan-backend），所以不能再用「VITE_API_URL 非空」判断后端可用性 —— 那样
        # 前端会退回 IndexedDB 本地模式，管理后台导入的词库在 /decks 永远看不见。
        VITE_SERVER_MODE: "1"
    ports:
      - "5000:5000"
    depends_on:
      - moyan-backend
    restart: unless-stopped

  moyan-admin:
    build: ./moyan-admin
    ports:
      - "5001:5001"
    depends_on:
      - moyan-backend
    restart: unless-stopped

  rehearse-backend:
    # 职演 API。与 moyan-backend 不同：**直接 docker build 出成品镜像**（§7.1）。
    # Go 编译便宜，不需要「CI 出二进制 → release 资产 → fetch-rust.sh → 挂载进
    # runtime 容器」那一套绕法，所以这里就是普通的多阶段构建，没有 image:、
    # 没有 pull_policy、没有 ./bin 挂载。
    #
    # 设计：docs/superpowers/specs/2026-10-02-rehearse-design.md
    build:
      context: ./rehearse-backend
    ports:
      - "4324:4324"
    environment:
      - PORT=4324
      # ⚠️ 下面三个键用 `${VAR:?}` 而不是 `${VAR:-默认}`——**这是刻意的**。
      #
      # `${VAR:-x}` 是「取默认值」，漏改服务器 .env 的后果是服务**带着假密钥
      # 正常启动**、所有 token 验不过（原来的 JWT_SECRET 写的就是
      # `:-change-me-in-production`），比启动失败难查得多。
      # `${VAR:?}` 让 `docker compose up -d` 在变量缺失时直接报错退出。
      # 见 §7.7 与 2026-10-02 的决定。
      - DATABASE_URL=${REHEARSE_DATABASE_URL:?REHEARSE_DATABASE_URL is required (Supabase pooler DSN, §7.3.2)}
      - JWT_SECRET=${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      - ADMIN_TOKEN=${AUTH_ADMIN_TOKEN:?AUTH_ADMIN_TOKEN is required}
      # Rehearse 没有 Web 客户端（§7.5），但管理端接口是被 moyan-admin 调的，
      # 那些 Origin 必须在列表里，否则后台的「职演」区块会被 CORS 拦掉。
      - ALLOWED_ORIGINS=${REHEARSE_ALLOWED_ORIGINS:-http://localhost:5000,http://localhost:5001,https://moyan.0x81.uk,https://admin-moyan.0x81.uk,https://admin.moyan.0x81.uk,https://rehearse.0x81.uk}
      # LLM 配置的 env 兜底（§7.3.2）。权威来源是 DB 里的 rehearse_settings；
      # 这三个只保证「DB 还没配 / 不可达」时服务仍能起来。
      - REHEARSE_LLM_BASE_URL=${REHEARSE_LLM_BASE_URL:-}
      - REHEARSE_LLM_API_KEY=${REHEARSE_LLM_API_KEY:-}
      - REHEARSE_LLM_MODEL=${REHEARSE_LLM_MODEL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      # 镜像是 scratch——**里面没有 shell、没有 wget、没有 curl**，
      # 所以不能用 moyan-backend 那种 `wget --spider`，只能让二进制自探。
      test: ["CMD", "/rehearse", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  website-rs:
    # 同上：runtime stage 只装 ca-certificates/curl，二进制由 fetch-rust.sh 拉取后挂载。
    image: 0x81/website-rs-runtime:local
    # 同 moyan-backend：本机构建产物，不来自 registry，故不尝试 pull。
    pull_policy: build
    build:
      context: ./website-rs
      target: runtime
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RUST_LOG=info
      - PROXY_UPSTREAM_HOST_TACT=website
      - PROXY_UPSTREAM_HOST_INDEX=0xindex
      - PROXY_UPSTREAM_HOST_CRAB=crab-web
      - PROXY_UPSTREAM_HOST_MOYAN=moyan-web
      - PROXY_UPSTREAM_HOST_MOYAN_ADMIN=moyan-admin
      # 统一登录入口 auth.0x81.uk → moyan-backend。它和 PROXY_UPSTREAM_HOST_MOYAN
      # 是两回事：那个是墨言产品域名（指向前端），这个是跨产品的「登录」能力域名
      # （直接指向后端）。将来 auth 抽成独立服务时只改这一个键。
      # 设计：docs/superpowers/specs/2026-10-02-gateway-auth-design.md
      - PROXY_UPSTREAM_AUTH=moyan-backend
      # 职演（Rehearse）的 API 入口，直连后端（它没有 Web 前端）。
      - PROXY_UPSTREAM_HOST_REHEARSE=rehearse-backend
      - TLS_CERT_PATH=/certs/origin.pem
      - TLS_KEY_PATH=/certs/origin-key.pem
    volumes:
      - ./certs:/certs:ro,Z
      # ^ :Z 与其它挂载一致（SELinux enforcing 的主机上不加会导致容器读不到证书，
      #   而网关对此只 warn 并退回仅 HTTP——见 scripts/check-tls.sh）
      # 二进制（scripts/fetch-rust.sh 从 release 拉取；本地构建则跑 scripts/build-rust.sh）
      - ./bin/website-rs:/app/website-rs:ro,Z
    depends_on:
      - website
      - 0xindex
      - crab-web
      - moyan-web
      - moyan-admin
      - rehearse-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
