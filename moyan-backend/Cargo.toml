[package]
name = "moyan-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Moyan Team"]
description = "墨言单词后端 API - Rust + Axum + SQLx"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros", "multipart"] }
calamine = "0.26"
rust_xlsxwriter = "0.79"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br"] }
hyper = { version = "1.6", features = ["full"] }

# Async Runtime
tokio = { version = "1.44", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
mongodb = "3.2"
bson = { version = "2.15", features = ["chrono-0_4"] }
futures-util = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "9.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
oauth2 = "5.0"
reqwest = { version = "0.12", features = ["json"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Time & UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment
dotenvy = "0.15"

# Password Hashing (for future local auth)
argon2 = "0.5"
password-hash = "0.5"

# Utilities
once_cell = "1.21"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
