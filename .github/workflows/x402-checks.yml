name: x402 Checks

# x402-gateway 的门禁：fmt → clippy -D warnings → test → release build → Docker image。
# 路径过滤与 rust-checks.yml 一致；如果把它设成 required check，记得去掉 paths。
#
# ⚠️ 镜像构建放在这里，而不是 docker-build.yml 的 matrix 里：那个 workflow
# 每次 push 都跑，x402 没改也会重新构建；放在这个路径过滤的 workflow 里，
# 只有动到 x402-gateway/** 时才构建镜像。
on:
  push:
    branches: [main, develop]
    paths:
      - "x402-gateway/**"
      - ".github/workflows/x402-checks.yml"
  pull_request:
    paths:
      - "x402-gateway/**"
      - ".github/workflows/x402-checks.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  x402-gateway:
    name: x402-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x402-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: x402-gateway

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- --deny warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build (release)
        run: cargo build --release

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./x402-gateway
          push: false
          load: false
          # 与 x402-gateway/Dockerfile 的默认值保持一致；改版本时两处一起改。
          build-args: |
            RUST_IMAGE=rust:1.85
          cache-from: type=gha
          cache-to: type=gha,mode=max
