<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨言 - 学习统计</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/mobile.css">
</head>
<body>
  <main class="mobile-shell">
    <header class="mobile-header"><div><p class="eyebrow">积累正在发生</p><h1 class="wordmark display">学习统计</h1></div><button class="avatar" type="button" data-toast-action="本周比上周多完成 16 次复习" aria-label="统计提醒">18</button></header>
    <section aria-labelledby="streak-title"><p class="section-kicker">当前连续</p><p class="stat-lead" id="streak-title"><strong data-streak>18</strong> 天<br>最长连续 32 天，保持这个节奏。</p></section>
    <section aria-label="核心指标"><div class="metric-grid"><article class="metric"><strong>642</strong><span>已掌握</span></article><article class="metric"><strong>92%</strong><span>正确率</span></article><article class="metric"><strong>48</strong><span>今日复习</span></article><article class="metric"><strong>944</strong><span>总词汇量</span></article></div></section>
    <section aria-labelledby="trend-title"><div class="section-head"><h2 id="trend-title">复习趋势</h2></div><div class="range-control" aria-label="时间范围"><button class="is-active" type="button" data-range="7">7 天</button><button type="button" data-range="30">30 天</button><button type="button" data-range="90">90 天</button></div><div class="trend" data-trend aria-label="每日复习数量趋势"></div><div class="trend-labels"><span>开始</span><span>今天</span></div><p class="empty-state" data-no-data hidden>这段时间还没有学习记录。</p></section>
    <section aria-labelledby="quality-title"><div class="section-head"><h2 id="quality-title">掌握质量</h2></div><article class="quality-card"><div class="quality-line"><span>熟练</span><div class="progress"><i style="width:68%"></i></div><b>68%</b></div><div class="quality-line"><span>巩固中</span><div class="progress"><i style="width:24%"></i></div><b>24%</b></div><div class="quality-line"><span>新词</span><div class="progress"><i style="width:8%"></i></div><b>8%</b></div></article></section>
  </main>
  <nav class="bottom-nav" aria-label="主导航"><a href="index.html">学习</a><a href="decks.html">Decks</a><a class="is-active" href="stats.html" aria-current="page">统计</a><a href="settings.html">设置</a></nav>
  <div class="toast" data-toast hidden role="status"></div>
  <script type="module">
    import { LEARNING } from '../assets/mock-data.js'
    import { renderTrend, showToast } from '../assets/prototype.js'
    const root = document
    root.querySelector('[data-streak]').textContent = LEARNING.streak
    root.querySelectorAll('[data-range]').forEach((button) => button.addEventListener('click', () => { root.querySelectorAll('[data-range]').forEach((node) => node.classList.toggle('is-active', node === button)); renderTrend(root, button.dataset.range); showToast(root, `正在查看最近 ${button.dataset.range} 天`) }))
    root.querySelectorAll('[data-toast-action]').forEach((button) => button.addEventListener('click', () => showToast(root, button.dataset.toastAction)))
    renderTrend(root, '7')
  </script>
</body>
</html>
