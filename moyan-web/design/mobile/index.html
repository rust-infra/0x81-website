<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨言 - 今日学习</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/mobile.css">
</head>
<body>
  <main class="mobile-shell">
    <header class="mobile-header">
      <div><p class="eyebrow">每日英语训练</p><h1 class="wordmark display">墨言</h1></div>
      <button class="avatar" type="button" data-toast-action="个人资料将在正式版开放" aria-label="个人资料">若</button>
    </header>

    <section class="hero" aria-labelledby="daily-title">
      <p class="section-kicker">DAY 18 · 连续学习</p>
      <h2 class="display" id="daily-title">今天，学好 24 个词</h2>
      <p>约 12 分钟。计算机英语有 18 个词等待复习。</p>
      <button class="primary-button wide" type="button" data-open-modal="study">开始今日训练</button>
    </section>

    <section aria-labelledby="overview-title">
      <div class="section-head"><h2 id="overview-title">今日概览</h2><a class="text-link" href="stats.html">查看统计</a></div>
      <div class="metric-grid">
        <article class="metric"><strong data-learning="reviews">48</strong><span>今日复习</span></article>
        <article class="metric"><strong data-learning="accuracy">92%</strong><span>回答正确率</span></article>
        <article class="metric"><strong data-learning="mastered">642</strong><span>已掌握词汇</span></article>
        <article class="metric"><strong data-learning="streak">18</strong><span>连续学习天数</span></article>
      </div>
    </section>

    <section aria-labelledby="due-title">
      <div class="section-head"><h2 id="due-title">等待复习</h2><a class="text-link" href="decks.html">全部词库</a></div>
      <div class="deck-stack" data-due-decks></div>
      <p class="empty-state" data-no-due hidden>今天的复习已完成。明天再见。</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主导航">
    <a class="is-active" href="index.html" aria-current="page">学习</a>
    <a href="decks.html">词库</a>
    <a href="stats.html">统计</a>
    <a href="settings.html">设置</a>
  </nav>
  <div class="toast" data-toast hidden role="status"></div>

  <div class="modal-backdrop" data-modal="study" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="study-title">
      <button class="modal-close" type="button" data-close-modal aria-label="关闭">×</button>
      <h2 class="display" id="study-title">训练预览</h2>
      <p>将从计算机英语开始，依次完成拼写、释义和发音练习。</p>
      <div class="deck-card"><div class="deck-row"><strong>algorithm</strong><span class="status-pill">第 1 / 24</span></div><p>n. 算法；规则</p></div>
      <div class="modal-actions"><button class="primary-button" type="button" data-toast-action="训练已准备好，继续保持节奏">进入训练</button></div>
    </section>
  </div>

  <script type="module">
    import { DECKS, LEARNING } from '../assets/mock-data.js'
    import { showToast } from '../assets/prototype.js'
    const root = document
    root.querySelectorAll('[data-learning]').forEach((node) => {
      const values = { reviews: LEARNING.todayReviews, accuracy: `${LEARNING.accuracy}%`, mastered: LEARNING.mastered, streak: LEARNING.streak }
      node.textContent = values[node.dataset.learning]
    })
    const dueDecks = DECKS.filter((deck) => deck.due > 0)
    root.querySelector('[data-due-decks]').innerHTML = dueDecks.map((deck) => `
      <article class="deck-card"><div class="deck-row"><div><h3>${deck.name}</h3><p>${deck.words} 词 · 正确率 ${deck.accuracy}%</p></div><span class="status-pill">${deck.due} 待复习</span></div><div class="progress"><i style="width:${deck.progress}%"></i></div></article>`).join('')
    root.querySelector('[data-no-due]').hidden = dueDecks.length !== 0
    root.querySelectorAll('[data-open-modal]').forEach((button) => button.addEventListener('click', () => { root.querySelector(`[data-modal="${button.dataset.openModal}"]`).hidden = false }))
    root.querySelectorAll('[data-close-modal]').forEach((button) => button.addEventListener('click', () => { button.closest('[data-modal]').hidden = true }))
    root.querySelectorAll('[data-toast-action]').forEach((button) => button.addEventListener('click', () => { showToast(root, button.dataset.toastAction) }))
  </script>
</body>
</html>
