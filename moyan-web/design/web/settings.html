<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨言 - Web 设置</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/web.css">
</head>
<body>
  <main class="web-shell">
    <nav class="top-nav" aria-label="主导航"><a class="brand display" href="index.html">墨言</a><div class="route-links"><a href="index.html">今日</a><a href="decks.html">词库</a><a href="stats.html">统计</a><a class="is-active" href="settings.html" aria-current="page">设置</a></div><span class="web-avatar" aria-hidden="true">若</span></nav>
    <header class="page-head"><div><p class="eyebrow">Preferences</p><h1 class="display">设置</h1><p>通用、语音和主题偏好只更新当前设计稿状态。</p></div></header>
    <section class="settings-layout">
      <div><div class="tab-row" role="tablist" aria-label="设置分类"><button class="is-active" type="button" role="tab" data-tab="general">通用</button><button type="button" role="tab" data-tab="voice">语音</button><button type="button" role="tab" data-tab="theme">主题</button></div>
        <section class="tab-pane is-active setting-panel" data-pane="general" role="tabpanel"><div class="settings-row"><div><strong>学习语言</strong><div class="muted" data-language-label>简体中文</div></div><button class="secondary-button" type="button" data-language>切换</button></div><div class="settings-row"><div><strong>每日提醒</strong><div class="muted">20:30 推送提醒</div></div><button class="toggle is-on" type="button" aria-pressed="true" data-toggle="每日提醒"></button></div><div class="settings-row"><div><strong>同步</strong><div class="muted">演示反馈，不连接服务</div></div><button class="secondary-button" type="button" data-toast-action="同步检查完成，当前为演示数据">检查</button></div><div class="settings-row"><div><strong>导入 / 导出</strong><div class="muted">不会读取或下载文件</div></div><button class="secondary-button" type="button" data-toast-action="导入导出将在正式版开放">管理</button></div></section>
        <section class="tab-pane setting-panel" data-pane="voice" role="tabpanel"><div class="settings-row"><div><strong>发音偏好</strong><div class="muted" data-voice-label>美式英语</div></div><button class="secondary-button" type="button" data-voice>切换</button></div><div class="settings-row"><div><strong>自动朗读单词</strong><div class="muted">进入卡片时播放</div></div><button class="toggle is-on" type="button" aria-pressed="true" data-toggle="自动朗读单词"></button></div><div class="settings-row"><div><strong>语速</strong><div class="muted">正常</div></div><button class="secondary-button" type="button" data-toast-action="当前朗读速度：正常">试听</button></div></section>
        <section class="tab-pane setting-panel" data-pane="theme" role="tabpanel"><div class="theme-options" data-themes></div><div class="settings-row"><div><strong>重置学习数据</strong><div class="muted">危险操作仅展示确认反馈</div></div><button class="secondary-button" type="button" data-toast-action="已显示确认提示，演示不会删除数据">重置</button></div></section>
      </div>
      <aside class="preview-card"><p class="section-kicker">实时预览</p><h2>阅读卡片</h2><p>主题与语音选择会即时反映在这里，便于后续 UI 修改时比较。</p><div class="preview-sample"><strong class="display">compile</strong><p>v. 编译；整理成册。当前发音：<span data-preview-voice>美式英语</span></p></div></aside>
    </section>
  </main>
  <div class="toast" data-toast hidden role="status"></div>
  <script type="module">
    import { THEMES } from '../assets/mock-data.js'
    import { bindPrototype, showToast } from '../assets/prototype.js'
    const root = document
    bindPrototype(root)
    root.querySelector('[data-themes]').innerHTML = THEMES.map((theme, index) => `<button class="theme-button ${index === 0 ? 'is-active' : ''}" type="button" data-theme="${theme.id}" style="--theme-paper:${theme.paper}"><i class="swatch" style="background:${theme.paper}"></i>${theme.label}</button>`).join('')
    root.querySelectorAll('[data-toggle]').forEach((button) => button.addEventListener('click', () => { button.classList.toggle('is-on'); button.setAttribute('aria-pressed', button.classList.contains('is-on')); showToast(root, `${button.dataset.toggle}已${button.classList.contains('is-on') ? '开启' : '关闭'}`) }))
    root.querySelector('[data-language]').addEventListener('click', () => { const label = root.querySelector('[data-language-label]'); label.textContent = label.textContent === '简体中文' ? 'English' : '简体中文'; showToast(root, '语言显示已更新') })
    root.querySelector('[data-voice]').addEventListener('click', () => { const label = root.querySelector('[data-voice-label]'); label.textContent = label.textContent === '美式英语' ? '英式英语' : '美式英语'; root.querySelector('[data-preview-voice]').textContent = label.textContent; showToast(root, '发音偏好已更新') })
    root.querySelectorAll('[data-theme]').forEach((button) => button.addEventListener('click', () => { root.querySelectorAll('[data-theme]').forEach((node) => node.classList.toggle('is-active', node === button)); root.documentElement.style.setProperty('--paper', button.style.getPropertyValue('--theme-paper')); showToast(root, '主题预览已更新') }))
    root.querySelectorAll('[data-toast-action]').forEach((button) => button.addEventListener('click', () => showToast(root, button.dataset.toastAction)))
  </script>
</body>
</html>
