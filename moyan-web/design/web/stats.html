<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨言 - Web 统计</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/web.css">
</head>
<body>
  <main class="web-shell">
    <nav class="top-nav" aria-label="主导航"><a class="brand display" href="index.html">墨言</a><div class="route-links"><a href="index.html">今日</a><a href="decks.html">词库</a><a class="is-active" href="stats.html" aria-current="page">统计</a><a href="settings.html">设置</a></div><button class="web-avatar" type="button" data-toast-action="本周比上周多完成 16 次复习" aria-label="统计提醒">18</button></nav>
    <header class="page-head"><div><p class="eyebrow">Learning Analytics</p><h1 class="display">学习统计</h1><p>用趋势、连续天数和掌握质量观察词汇积累。</p></div><div class="range-control" aria-label="时间范围"><button class="is-active" type="button" data-range="7">7 天</button><button type="button" data-range="30">30 天</button><button type="button" data-range="90">90 天</button></div></header>
    <section class="stats-grid"><article class="surface trend-card"><div class="section-head"><h2>复习趋势</h2><p data-range-label>最近 7 天</p></div><div class="trend" data-trend aria-label="复习趋势"></div><div class="trend-labels"><span>开始</span><span>今天</span></div><p class="empty-state" data-no-data hidden>这段时间还没有学习记录。</p></article><article class="surface streak-card"><span class="section-kicker">当前连续</span><strong data-streak>18</strong><p>最长连续 32 天。保持这个节奏，复习负担会更稳定。</p></article></section>
    <section class="metrics-row"><article class="metric"><strong>642</strong><span>已掌握</span></article><article class="metric"><strong>944</strong><span>总词汇</span></article><article class="metric"><strong>92%</strong><span>正确率</span></article><article class="metric"><strong>48</strong><span>今日复习</span></article></section>
    <section class="mastery-layout"><article class="quality-card"><div class="mastery-ring"><div><strong>68%</strong><span>熟练掌握</span></div></div></article><article class="quality-card"><div class="section-head"><h2>掌握质量</h2><p>按当前复习表现估算</p></div><div class="quality-line"><span>熟练</span><div class="progress"><i style="width:68%"></i></div><b>68%</b></div><div class="quality-line"><span>巩固中</span><div class="progress"><i style="width:24%"></i></div><b>24%</b></div><div class="quality-line"><span>新词</span><div class="progress"><i style="width:8%"></i></div><b>8%</b></div></article></section>
    <section class="heatmap-card surface"><div class="section-head"><h2>18 周活跃热力图</h2><p>颜色越深代表复习越多</p></div><div class="heatmap" data-heatmap aria-label="18 周学习活跃度"></div></section>
  </main>
  <div class="toast" data-toast hidden role="status"></div>
  <script type="module">
    import { LEARNING } from '../assets/mock-data.js'
    import { renderTrend, showToast } from '../assets/prototype.js'
    const root = document
    root.querySelector('[data-streak]').textContent = LEARNING.streak
    root.querySelector('[data-heatmap]').innerHTML = Array.from({ length: 126 }, (_, index) => `<i data-level="${(index * 7 + index % 5) % 4}"></i>`).join('')
    root.querySelectorAll('[data-range]').forEach((button) => button.addEventListener('click', () => { root.querySelectorAll('[data-range]').forEach((node) => node.classList.toggle('is-active', node === button)); root.querySelector('[data-range-label]').textContent = `最近 ${button.dataset.range} 天`; renderTrend(root, button.dataset.range); showToast(root, `正在查看最近 ${button.dataset.range} 天`) }))
    root.querySelectorAll('[data-toast-action]').forEach((button) => button.addEventListener('click', () => showToast(root, button.dataset.toastAction)))
    renderTrend(root, '7')
  </script>
</body>
</html>
